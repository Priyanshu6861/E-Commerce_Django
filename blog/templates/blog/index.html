{% extends 'blog/base.html' %}

{% block blog_body %}
<div class="container my-4">
    <div class="row mb-2">
        {% for item in mypost %}
        <div class="col-md-6 mb-4">
            <div class="card h-100 overflow-hidden shadow-sm border-0" style="border-radius: 20px;">
                <div class="row no-gutters h-100">
                    <div class="col-sm-7 p-4 d-flex flex-column position-static">
                        <strong class="d-inline-block mb-2 text-primary">{{item.head0}}</strong>
                        <h4 class="mb-2 font-weight-bold">{{item.title}}</h4>
                        <div class="mb-2 text-muted small"><i class="far fa-calendar-alt mr-1"></i> {{item.pub_date}}</div>
                        <p class="card-text mb-auto text-muted">{{item.chead0|slice:"0:80"}}...</p>
                        <a href="blogpost/{{item.post_id}}" class="btn btn-link text-primary p-0 mt-3 font-weight-bold text-left">
                            Read More <i class="fas fa-arrow-right ml-1"></i>
                        </a>
                    </div>
                    <div class="col-sm-5">
                        <img src="media/{{item.thumbnail}}" class="h-100 w-100" style="object-fit: cover;" alt="{{item.title}}">
                    </div>
                </div>
            </div>
        </div>
        {% if forloop.counter|divisibleby:2 and not forloop.last %}
    </div><div class="row mb-2">
        {% endif %}
        {% endfor %}
    </div>
</div>
{% endblock blog_body %}
